<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxy Android</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#000;color:#fff}

/* LOGIN */
.tela-login{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
gap:18px;
}

.logo-main{font-size:22px;font-weight:900}
.proxy{color:#fff}
.android{color:#00ff3b}

.logo-sub{
font-size:11px;
letter-spacing:6px;
color:#2a2a2a;
}

.container{width:420px}

.card{
background:#0b0b0b;
padding:26px;
border-radius:18px;
border:1px solid #1a1a1a;
}

.login-title{
text-align:center;
font-size:13px;
color:#888;
margin-bottom:14px;
}

label{
font-size:11px;
color:#666;
display:block;
margin-bottom:8px;
}

input{
width:100%;
height:54px;
background:#101010;
border:1px solid #1d1d1d;
border-radius:12px;
color:#fff;
padding:10px;
margin-bottom:18px;
}

button{
width:100%;
height:56px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#ff86cb,#ff4fa3,#ff208f);
color:#fff;
font-weight:700;
cursor:pointer;
}

/* PAINEL */
.tela-painel{display:none}

.topbar{
position:fixed;
top:0;
left:0;
width:100%;
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 14px;
background:#000;
z-index:10;
}

.left{display:flex;align-items:center;gap:10px}
.title{display:flex;gap:5px;font-weight:900}
.proxy{color:#fff}
.android{color:#00ff3b}

.status{
display:flex;
align-items:center;
gap:6px;
font-size:11px;
color:#ff3b3b;
}

.dot{
width:7px;
height:7px;
background:#ff3b3b;
border-radius:50%;
animation:pulse 1.2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);opacity:.4}
50%{transform:scale(1.6);opacity:1}
100%{transform:scale(1);opacity:.4}
}

.menu-btn{
width:34px;
height:34px;
display:flex;
align-items:center;
justify-content:center;
background:#111;
border-radius:8px;
cursor:pointer;
color:#fff;
}

.sidebar{
position:fixed;
top:60px;
left:-260px;
width:260px;
height:100%;
background:#000;
padding:20px;
transition:.3s;
z-index:20;
}

.sidebar.open{left:0}

.menu-item{
padding:12px;
color:#ccc;
margin-bottom:6px;
border-radius:8px;
cursor:pointer;
}

.menu-item.active{background:#00ff3b;color:#000}

.page{display:none;padding:80px 14px}
.page.active{display:block}

.bloco{
background:#161616;
padding:18px 14px;
border-radius:12px;
}

.funcao{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 0;
}

.nome{font-weight:700}
.desc{font-size:11px;color:#8a8a8a}

.switch input{display:none}

.switch span{
width:40px;
height:20px;
background:#555;
border-radius:20px;
display:block;
position:relative;
}

.switch span:before{
content:"";
position:absolute;
width:16px;
height:16px;
top:2px;
left:2px;
background:#fff;
border-radius:50%;
transition:.3s;
}

.switch input:checked + span{
background:#00ff3b;
}

.switch input:checked + span:before{
transform:translateX(20px);
}

#entrar{
display:none;
margin-top:12px;
padding:10px;
text-align:center;
background:#00ff3b;
color:#000;
font-weight:800;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="tela-login" id="login">

<div class="logo-main">
<span class="proxy">PROXY</span>
<span class="android">ANDROID</span>
</div>

<div class="logo-sub">SISTEMA DE CONTROLE</div>

<div class="container">
<div class="card">

<div class="login-title">ACESSE SUA CONTA</div>

<label>CHAVE DE ACESSO</label>
<input id="chave" type="password">

<button onclick="login()">ENTRAR</button>

</div>
</div>
</div>

<!-- PAINEL -->
<div class="tela-painel" id="painel">

<div class="topbar">
<div class="left">
<div class="menu-btn" onclick="toggleMenu()">☰</div>

<div class="title">
<span class="proxy">PROXY</span>
<span class="android">ANDROID</span>
</div>
</div>

<div class="status">
<div class="dot"></div>
<span id="statusText">OFFLINE</span>
</div>
</div>

<div class="sidebar" id="sidebar">
<div class="menu-item active" onclick="openPage('inicio',this)">Início</div>
<div class="menu-item" onclick="openPage('conexao',this)">Conexão</div>
<div class="menu-item" onclick="openPage('info',this)">Informação</div>
</div>

<div id="inicio" class="page active">
<div class="bloco">

<div class="funcao">
<div><div class="nome">Regedit Vip v2</div><div class="desc">Ajuste avançado</div></div>
<label class="switch"><input type="checkbox"><span></span></label>
</div>

<div class="funcao">
<div><div class="nome">Precision</div><div class="desc">Melhora precisão</div></div>
<label class="switch"><input type="checkbox"><span></span></label>
</div>

<div class="funcao">
<div><div class="nome">Aim Assist</div><div class="desc">Auxílio de mira</div></div>
<label class="switch"><input type="checkbox"><span></span></label>
</div>

<div class="funcao">
<div><div class="nome">Stability</div><div class="desc">Recoil control</div></div>
<label class="switch"><input type="checkbox"><span></span></label>
</div>

<div class="funcao">
<div><div class="nome">Bypass</div><div class="desc">Proteção sistema</div></div>
<label class="switch"><input type="checkbox"><span></span></label>
</div>

</div>
</div>

<div id="conexao" class="page">
<div class="bloco">
<div style="color:#00ff3b;font-weight:700;margin-bottom:10px;">CONECTAR</div>
<input id="codigoConexao" placeholder="Digite o código">
<button>PAREAR</button>
</div>
</div>

<div id="info" class="page">
<div class="bloco">
<div style="color:#fff;">User</div>
<div style="color:#aaa;">Proxy</div>
<div style="color:#fff;margin-top:10px;">Versão</div>
<div style="color:#aaa;">Android</div>
</div>
</div>

</div>

<!-- FIREBASE CORRIGIDO -->
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBNDw-vbIeCxzfK-W6SM4JZ2FCQ_EgIRBc",
  authDomain: "painel-85487.firebaseapp.com",
  databaseURL: "https://painel-85487-default-rtdb.firebaseio.com",
  projectId: "painel-85487"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function login(){
const chave = document.getElementById("chave").value;

db.ref("datauser").once("value").then(snap=>{
const data = snap.val();

if(!data){
alert("Erro no banco");
return;
}

if(chave === data.KEY){
document.getElementById("login").style.display="none";
document.getElementById("painel").style.display="block";
}else{
alert("Login inválido");
}
});
}
</script>

</body>
</html>
